[project]
name = "book-recommender"
version = "0.1.0"
description = "Swipe-based book recommender: seed, swipe, and adaptive-hybrid recommendations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TomÃ¡s Feith" }]
dependencies = [
    "numpy>=1.26",
    "streamlit>=1.61.1",
    "sentence-transformers>=5.7.0",
    "torch>=2.2",
    "scipy>=1.18.0",
    "openpyxl>=3.1.5",
    "faiss-cpu>=1.15.0",
]

[tool.uv]
# torch's default PyPI wheels are CPU-only on Windows, which is what we want.
#
# The gitpython constraint is currently INERT: streamlit 1.61.1 dropped the
# dependency, so gitpython is no longer in the resolved tree at all. It is kept
# as a guard in case a future streamlit reintroduces it, because the floor goes
# stale silently -- it sat at 3.1.55 while 3.1.57 resolved with five open
# advisories (GHSA-9rj7-rf2p-w77r, -4gmw-gg2m-w46p, -hh9p-6wh2-4mfc,
# -wvpp-8hx9-p66j, -jm78-9fvv-mhgr), all fixed in 3.1.58. The `audit` CI job is
# continue-on-error, so it reports rather than blocks: read it after a bump.
constraint-dependencies = ["gitpython>=3.1.58"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "types-openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv39", "data", ".cache"]

[tool.ruff.lint]
# Pragmatic set: pyflakes/pycodestyle errors, import sorting, pyupgrade,
# bugbear, comprehensions, simplify, and ruff's own rules.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "B008",    # function calls in argument defaults (Path(...) defaults are fine here)
    "SIM108",  # ternary-vs-if is a readability judgement call
    "RUF002",  # ambiguous unicode in docstrings -- the prose deliberately uses em-dashes/arrows
    "RUF003",  # ...likewise in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
# Scoped to the serving/eval library. Scripts are operational glue over heavy,
# untyped third-party deps (torch, sentence-transformers, network I/O).
files = ["app", "eval"]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Named explicitly rather than a blanket ignore_missing_imports, so an import
# that stops resolving is an error rather than being silently accepted. The old
# comment listed sentence_transformers, streamlit and torch as stub-less; all
# three ship type information now, and only scipy actually still needs this.
# openpyxl is covered by the types-openpyxl stubs in the dev group instead.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "eval"]
# The batch CLIs / demo are entrypoint scripts, not unit-tested library code.
omit = [
    "app/demo.py",
    "eval/run.py",
    "eval/compare_paradigms.py",
    "eval/cold_start.py",
    "eval/diversity.py",
    "eval/learned_rerank.py",
    "eval/served_eval.py",
    "eval/repr_sweep.py",
]

[tool.coverage.report]
show_missing = true
# A ratchet against regressions, not a quality claim (currently ~78%). Measure
# source only -- counting the test files inflates it. app/external.py (live HTTP)
# and app/ann.py (needs a built FAISS index) are the thin ones.
fail_under = 75
