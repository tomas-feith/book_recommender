name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  quality:
    # Windows is a primary target (scripts/freeport.py exists because of Windows
    # bind semantics), so an Ubuntu-only build would not exercise it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv stopped publishing moving major tags after v7.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync environment (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Pytest (with coverage floor)
        run: uv run --no-sync python -m pytest --cov=app --cov=eval --cov-report=term-missing

  audit:
    # Advisory: reports vulnerable dependencies without blocking the merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit
        run: uv run --no-sync pip-audit

  secret-scan:
    # .gitignore is the only thing keeping .env out of this repo; verify that held.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: gitleaks scans commits, not the worktree
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisation-owned repos.
